<mjml>
  <mj-head>
    <mj-title>New contact enquiry from {{name}}</mj-title>
    <mj-preview>Someone just sent a message through the contact form.</mj-preview>
    <mj-attributes>
      <mj-all font-family="Inter, Helvetica, Arial, sans-serif" />
      <mj-section background-color="#ffffff" padding="0 36px" />
      <mj-text color="#0a1f44" font-size="15px" line-height="1.6" padding="0" />
      <mj-button background-color="#1f69ff" color="#ffffff" border-radius="24px" font-weight="700"
        inner-padding="14px 28px" align="left" />
      <mj-class name="h" font-family="Poppins, Arial, sans-serif" font-weight="700" />
    </mj-attributes>
  </mj-head>
  <mj-body background-color="#f7fafd">
    <mj-section background-color="#1f69ff" padding="24px 36px">
      <mj-column>
        <mj-image src="images/logo.jpg" alt="RITA Tours N Travels" width="52px" align="left" padding="0 0 10px 0" />
        <mj-text color="#ffffff" font-size="17px" font-weight="700" padding="0">New contact enquiry</mj-text>
      </mj-column>
    </mj-section>

    <mj-section padding="40px 36px 8px">
      <mj-column>
        <mj-text mj-class="h" font-size="28px" line-height="1.2" padding="0 0 8px 0">{{name}} just wrote in</mj-text>
        <mj-text color="#3f5578" font-size="16px" padding="0">Topic: <strong>{{topic}}</strong></mj-text>
      </mj-column>
    </mj-section>

    <mj-section background-color="#f0f5ff" border-radius="24px" padding="24px 36px">
      <mj-column>
        <mj-text font-size="14px" padding="0 0 6px 0"><strong>Name:</strong> {{name}}</mj-text>
        <mj-text font-size="14px" padding="0 0 6px 0"><strong>Email:</strong> {{email}}</mj-text>
        <mj-text font-size="14px" padding="0 0 6px 0"><strong>Topic:</strong> {{topic}}</mj-text>
        <mj-text font-size="14px" padding="0"><strong>Browsing in:</strong> {{language}} / {{currency}}</mj-text>
      </mj-column>
    </mj-section>

    <mj-section padding="24px 36px 8px">
      <mj-column>
        <mj-text font-size="14px" color="#3f5578" padding="0 0 8px 0"><strong>Message</strong></mj-text>
        <mj-text font-size="15px" padding="0">{{message}}</mj-text>
      </mj-column>
    </mj-section>

    <mj-section padding="20px 36px 40px">
      <mj-column>
        <mj-button href="mailto:{{email}}">Reply to {{name}}</mj-button>
      </mj-column>
    </mj-section>
  </mj-body>
</mjml>
